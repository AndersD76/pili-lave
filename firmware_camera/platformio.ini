; ============================================================
;  PILI LAVE — Câmera GATEWAY (arquitetura simplificada / Opção A)
;  A câmera conecta no Wi-Fi (credenciais fixas), é a MESTRE DE CANAL
;  (avisa display+waveshares por ESP-NOW) e faz TODO o HTTPS com a nuvem.
;  O display fica 100% ESP-NOW, sem Wi-Fi (não tem RAM p/ TLS).
; ============================================================
[env:esp32cam]
platform  = espressif32
board     = esp32cam            ; AI-Thinker ESP32-CAM (OV2640)
framework = arduino

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    bblanchon/ArduinoJson@6.21.5

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1

upload_speed = 921600
